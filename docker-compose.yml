# AltWiki production stack (wiki.at.online).
# Secrets live in .env.prod (not in git). Template: .env.prod.example
services:
  altwiki:
    build: .
    image: altwiki:latest
    depends_on:
      - db
      - redis
    env_file: .env.prod
    environment:
      APP_URL: 'https://wiki.at.online'
      REDIS_URL: 'redis://redis:6379'
      MAIL_DRIVER: 'smtp'
      MAIL_FROM_NAME: 'AltWiki'
      SMTP_HOST: 'smtp.gmail.com'
      SMTP_PORT: '587'
    ports:
      - "3001:3000"
    restart: unless-stopped
    volumes:
      - altwiki:/app/data/storage

  db:
    image: postgres:16-alpine
    # ports removed - only the app container needs access
    env_file: .env.prod
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  altwiki:
  db_data:
  redis_data:
